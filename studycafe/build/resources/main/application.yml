server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/studycafe?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: study_user
    password: study_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none # MySQL VARCHAR와 Enum 맵핑 유효성 검사 에러 방지
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
